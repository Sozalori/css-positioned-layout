<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  
  <header class="chat-header">
    <h1>Techup Chatroom</h1>
  </header>

  <main class="chat-area">
    
    <div class="message-row row-right">
      <div class="bubble bubble-green tail-right">
        สวัสดีจ้า
      </div>
    </div>

    <div class="message-row row-right">
      <div class="bubble bubble-grey container-x">
        Coding สนุกจังเลย
        <span class="btn-close-text">x</span>
      </div>
    </div>

    <div class="message-row row-right">
      <div class="bubble bubble-green">
        🤣 🤩
      </div>
    </div>

    <div class="message-row row-left">
      <div class="bubble bubble-darkgrey">
        🥰
      </div>
    </div>

    <div class="message-row row-left">
      <div class="bubble bubble-darkgrey">
        🥳
      </div>
    </div>

  </main>

</body>

</html>
