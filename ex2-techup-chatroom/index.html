<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header class="header">Techup Chatroom</header>

  <main class="chat">
    <!-- ข้อความของเรา (ขวา) -->
    <div class="message message-right message-green">
      <span class="tail"></span>
      <p>สวัสดีจ้า</p>
    </div>

    <div class="message message-right message-light">
      <p>Coding สนุกจังเลย</p>
      <button class="close-btn" aria-label="ลบข้อความ"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="message message-right message-green">
      <p>🥳 😍</p>
    </div>

    <!-- ข้อความของคนอื่น (ซ้าย) -->
    <div class="message message-left message-gray">
      <p>😍</p>
    </div>

    <div class="message message-left message-gray">
      <p>🥳</p>
    </div>
  </main>
</body>

</html>
